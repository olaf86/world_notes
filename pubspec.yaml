name: world_notes
description: "World Notes - location-based diary app with native maps & Firebase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Map
  google_maps_flutter: ^2.18.0
  apple_maps_flutter:
    git:
      url: https://github.com/olaf86/apple_maps_flutter.git
      ref: 2dcc9043cd056fcbf710afcf8d2907217ad1d08e

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Location
  geolocator: ^14.0.0

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Ads (Google Mobile Ads)
  google_mobile_ads: ^8.0.0

  # In-app purchases (RevenueCat)
  purchases_flutter: ^10.10.1
  purchases_ui_flutter: ^10.10.1

  # Image handling
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Utilities
  async: ^2.11.0
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.5
  firebase_app_check: ^0.4.5
  cloud_functions: ^6.3.3
  firebase_crashlytics: ^5.2.4
  firebase_messaging: ^16.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  shaders:
    - shaders/note_theme_background.frag
