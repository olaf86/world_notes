name: world_notes
description: "World Notes - location-based diary app with MapLibre & Firebase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Map
  maplibre_gl: ^0.22.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Location
  geolocator: ^14.0.0
  permission_handler: ^11.4.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Ads (Google Mobile Ads)
  google_mobile_ads: ^6.0.0

  # In-app purchases (RevenueCat)
  purchases_flutter: ^10.0.2

  # Geohash for proximity queries
  latlong2: ^0.9.1

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
