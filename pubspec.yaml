name: world_notes
description: "World Notes - location-based diary app with MapLibre & Firebase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Map
  maplibre_gl: ^0.26.1
  apple_maps_flutter:
    git:
      url: https://github.com/olaf86/apple_maps_flutter.git
      ref: 89fdc5bbc8d1ef52aab9514a1fe9d87db1d03221

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Location
  geolocator: ^14.0.0

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Ads (Google Mobile Ads)
  google_mobile_ads: ^8.0.0

  # In-app purchases (RevenueCat)
  purchases_flutter: ^10.0.2

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utilities
  async: ^2.11.0
  intl: ^0.20.2
  uuid: ^4.5.1
  purchases_ui_flutter: ^10.1.0
  shared_preferences: ^2.5.5
  firebase_app_check: ^0.3.2+10
  cloud_functions: ^5.6.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
