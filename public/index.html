<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Notes — Invitation</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #f7f7f8;
        color: #1c1c1e;
      }
      .card {
        text-align: center;
        padding: 32px;
        max-width: 360px;
      }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #6b6b70; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You've been invited to a World Notes place</h1>
      <p>
        Open this link on a device with the World Notes app installed to join.
        If the app didn't open automatically, install it and tap the link again.
      </p>
    </div>
  </body>
</html>
