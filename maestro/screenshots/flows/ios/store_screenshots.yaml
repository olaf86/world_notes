appId: dev.asobo.worldnotes
name: iPhone store screenshots
tags:
  - screenshots
  - ios
---
- launchApp:
    clearState: true
    permissions:
      location: inuse
- tapOn:
    text: "Allow While Using App"
    optional: true
- extendedWaitUntil:
    visible:
      id: "screen-map"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/ios_01_map"
- tapOn:
    id: "action-show-map-notes-list"
- extendedWaitUntil:
    visible:
      id: "screen-map-notes-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "map-note-card-wn_tokyo_station"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/ios_02_nearby_notes"
- tapOn:
    id: "map-note-card-wn_tokyo_station"
- extendedWaitUntil:
    visible:
      id: "screen-note-detail-wn_tokyo_station"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "action-toggle-message-like-msg_tokyo_03"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/ios_03_note_detail"
- tapOn:
    id: "action-close-note-detail"
- tapOn:
    id: "nav-notes"
- extendedWaitUntil:
    visible:
      id: "screen-my-notes"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "my-note-card-wn_tokyo_station"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/ios_04_my_notes"
- tapOn:
    id: "nav-profile"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/ios_05_profile"
- tapOn:
    id: "action-upgrade-to-pro"
- extendedWaitUntil:
    visible:
      id: "screen-subscription"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/ios_06_pro"
