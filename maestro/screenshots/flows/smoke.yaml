appId: dev.asobo.worldnotes
name: Screenshot environment smoke check
tags:
  - screenshots
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "screen-map"
    timeout: 20000
- tapOn:
    id: "action-show-map-notes-list"
- extendedWaitUntil:
    visible:
      id: "screen-map-notes-list"
    timeout: 15000
- tapOn:
    id: "action-show-map"
- extendedWaitUntil:
    visible:
      id: "screen-map"
    timeout: 15000
- tapOn:
    id: "nav-profile"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 15000
