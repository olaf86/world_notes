appId: dev.asobo.worldnotes
name: Android store screenshots
tags:
  - screenshots
  - android
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "screen-map"
    timeout: 20000
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/android_01_map"
- tapOn:
    id: "action-show-map-notes-list"
- extendedWaitUntil:
    visible:
      id: "screen-map-notes-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "map-note-card-wn_tokyo_station"
    timeout: 15000
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/android_02_nearby_notes"
- tapOn:
    id: "map-note-card-wn_tokyo_station"
- extendedWaitUntil:
    visible:
      id: "screen-note-detail-wn_tokyo_station"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "action-toggle-message-like-msg_tokyo_03"
    timeout: 15000
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/android_03_note_detail"
- back
- tapOn:
    id: "nav-notes"
- extendedWaitUntil:
    visible:
      id: "screen-my-notes"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "my-note-card-wn_tokyo_station"
    timeout: 15000
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/android_04_my_notes"
- tapOn:
    id: "nav-profile"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 15000
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/android_05_profile"
- tapOn:
    id: "action-upgrade-to-pro"
- extendedWaitUntil:
    visible:
      id: "screen-subscription"
    timeout: 15000
- takeScreenshot: "${SCREENSHOT_OUTPUT_DIR}/android_06_pro"
