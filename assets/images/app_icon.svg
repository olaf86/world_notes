<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="World Notes app icon">
  <defs>
    <linearGradient id="dotGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8D8F2"/>
      <stop offset="0.5" stop-color="#9DDDE1"/>
      <stop offset="1" stop-color="#A8E5C4"/>
    </linearGradient>
    <pattern id="staggeredDots" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="4" fill="#fff"/>
      <circle cx="48" cy="48" r="4" fill="#fff"/>
    </pattern>
    <mask id="dotMask">
      <rect width="1024" height="1024" fill="url(#staggeredDots)"/>
    </mask>
    <filter id="pencilWobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="pinOutline" d="M512 150C322 150 214 287 214 441c0 155 111 268 298 439 187-171 298-284 298-439 0-154-108-291-298-291Z"/>
    <circle id="pinHole" cx="512" cy="430" r="106"/>
  </defs>

  <rect width="1024" height="1024" fill="#FFFEFC"/>
  <rect width="1024" height="1024" fill="url(#dotGradient)" mask="url(#dotMask)"/>
  <use href="#pinOutline" fill="#FFFEFC"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#pencilWobble)">
    <use href="#pinOutline" stroke="#29BFE8" stroke-width="58"/>
    <use href="#pinOutline" stroke="#315BEA" stroke-width="50"/>
    <use href="#pinOutline" stroke="#8A4DDD" stroke-width="42"/>
    <use href="#pinOutline" stroke="#F34E8A" stroke-width="34"/>
    <use href="#pinOutline" stroke="#FF6D3A" stroke-width="26"/>
    <use href="#pinOutline" stroke="#F5C62A" stroke-width="18"/>
    <use href="#pinOutline" stroke="#62C96B" stroke-width="10"/>

    <use href="#pinHole" stroke="#F34E8A" stroke-width="58"/>
    <use href="#pinHole" stroke="#FF6D3A" stroke-width="50"/>
    <use href="#pinHole" stroke="#8A4DDD" stroke-width="42"/>
    <use href="#pinHole" stroke="#315BEA" stroke-width="34"/>
    <use href="#pinHole" stroke="#29BFE8" stroke-width="26"/>
    <use href="#pinHole" stroke="#62C96B" stroke-width="18"/>
    <use href="#pinHole" stroke="#F5C62A" stroke-width="10"/>
  </g>
  <circle cx="512" cy="430" r="76" fill="#FFFEFC"/>
</svg>
