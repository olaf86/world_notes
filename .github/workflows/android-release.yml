name: Android release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-aab:
    name: Analyze, test, and build signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      REVENUECAT_API_KEY_ANDROID: ${{ secrets.REVENUECAT_API_KEY_ANDROID }}
      ADMOB_ANDROID_APP_ID_PROD: ${{ secrets.ADMOB_ANDROID_APP_ID_PROD }}
      ADMOB_ANDROID_BANNER_AD_UNIT_ID_PROD: ${{ secrets.ADMOB_ANDROID_BANNER_AD_UNIT_ID_PROD }}
      ADMOB_ANDROID_INTERSTITIAL_AD_UNIT_ID_PROD: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL_AD_UNIT_ID_PROD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release secrets
        shell: bash
        run: |
          required_names=(
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            GOOGLE_MAPS_API_KEY
            REVENUECAT_API_KEY_ANDROID
            ADMOB_ANDROID_APP_ID_PROD
            ADMOB_ANDROID_BANNER_AD_UNIT_ID_PROD
            ADMOB_ANDROID_INTERSTITIAL_AD_UNIT_ID_PROD
          )
          for required_name in "${required_names[@]}"; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${required_name}"
              exit 1
            fi
          done

      - name: Restore upload keystore
        shell: bash
        run: |
          keystore_path="${RUNNER_TEMP}/world-notes-upload.jks"
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed release AAB
        run: >-
          flutter build appbundle --release
          --dart-define=GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
          --dart-define=REVENUECAT_API_KEY_ANDROID=${REVENUECAT_API_KEY_ANDROID}
          --dart-define=ADMOB_ANDROID_APP_ID_PROD=${ADMOB_ANDROID_APP_ID_PROD}
          --dart-define=BANNER_AD_UNIT_ID=${ADMOB_ANDROID_BANNER_AD_UNIT_ID_PROD}
          --dart-define=INTERSTITIAL_AD_UNIT_ID=${ADMOB_ANDROID_INTERSTITIAL_AD_UNIT_ID_PROD}

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: world-notes-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
